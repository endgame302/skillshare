    type: server
    dateAdded: '2025-05-05T20:08:35Z'
    image: ghcr.io/github/github-mcp-server@sha256:f6056fc10bfffcc8c81a6417a2e9ca12808647e8dd6049642a4feaadee0e0f8a
    ref: ''
