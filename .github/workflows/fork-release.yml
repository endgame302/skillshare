name: Fork patched release

# endgame302 fork only. Rebuilds the latest runkids/skillshare release with this fork's patches
# (the commits on `patched` that upstream does not have), tests it with upstream's own test suite
# plus .fork/canary.ps1, and publishes it here under the same version number. Installed copies
# upgrade from these releases (see the githubRepo ldflag below), so they keep the patches.
# A patch that no longer applies, or a failing test, opens an issue and publishes nothing.

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to build (default = latest upstream release)
        type: string
        default: ""
      force:
        description: Rebuild even if this fork already has a release for the tag
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM: runkids/skillshare

jobs:
  rebase:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
      sha: ${{ steps.replay.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patched
          fetch-depth: 0
          # Pushing a rebase that carries upstream's workflow changes needs the `workflows`
          # permission, which the default GITHUB_TOKEN never has.
          token: ${{ secrets.FORK_BOT_TOKEN }}

      - name: Fetch upstream tags into their own namespace
        run: |
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream '+refs/tags/v*:refs/upstream-tags/v*'

      - name: Pick the upstream release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          TAG="${INPUT_TAG:-$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)}"
          git rev-parse -q --verify "refs/upstream-tags/$TAG" >/dev/null || { echo "::error::upstream has no tag $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "This fork already has a release for $TAG. Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Replay this fork's patches onto the upstream release
        id: replay
        if: steps.pick.outputs.build == 'true'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE=$(git log --format='%s' "refs/upstream-tags/$TAG..HEAD")
          if ! git rebase "refs/upstream-tags/$TAG"; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "::error::The patches do not apply to $TAG"
            exit 1
          fi
          AFTER=$(git log --format='%s' "refs/upstream-tags/$TAG..HEAD")
          {
            echo "### Patches on $TAG"
            git log --format='- %s (`%h`)' "refs/upstream-tags/$TAG..HEAD"
            DROPPED=$(comm -23 <(echo "$BEFORE" | sort) <(echo "$AFTER" | sort))
            if [ -n "$DROPPED" ]; then echo; echo "Dropped because upstream already has them:"; echo "$DROPPED" | sed 's/^/- /'; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          git push --force-with-lease origin HEAD:patched
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report patches that do not apply
        if: failure() && steps.replay.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Upstream released $TAG, and this fork's patches do not apply to it. Nothing was published."
            echo
            echo "Conflicting files:"
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "Resolve it by rebasing \`patched\` onto upstream $TAG locally, then run this workflow again. Run: $RUN_URL"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Patches do not apply to upstream $TAG" --body-file "$RUNNER_TEMP/issue.md"

  test:
    needs: rebase
    if: needs.rebase.outputs.build == 'true'
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ needs.rebase.outputs.sha }}

  canary:
    needs: rebase
    if: needs.rebase.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebase.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o skillshare.exe ./cmd/skillshare
      - name: Canary (nothing skillshare did not create is removed or changed)
        shell: pwsh
        run: ./.fork/canary.ps1 -Exe ./skillshare.exe -Root "$env:RUNNER_TEMP\canary"

  release:
    needs: [rebase, test, canary]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.rebase.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebase.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.FORK_BOT_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI assets
        run: |
          cd ui && pnpm install --frozen-lockfile && pnpm run build && cd ..
          tar czf skillshare-ui-dist.tar.gz -C ui/dist .
          echo /skillshare-ui-dist.tar.gz >> .git/info/exclude

      - name: Fork GoReleaser config and release notes
        env:
          FORK_REPO: ${{ github.repository }}
        run: |
          # Upstream's config, changed for this fork: a published (not draft) release, no Homebrew
          # formula, and upgrades, version checks and the dashboard download pointed at this fork.
          yq '.release.draft = false | .release.use_existing_draft = false | del(.brews)
              | .builds[0].ldflags[0] += " -X skillshare/internal/version.githubRepo=" + strenv(FORK_REPO)' \
              .goreleaser.yaml > "$RUNNER_TEMP/goreleaser.fork.yaml"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream "+refs/tags/$TAG:refs/upstream-tags/$TAG"
          {
            echo "Patched build of [$UPSTREAM $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG)."
            echo
            echo "Patches on top of upstream:"
            git log --format='- %s (%h)' "refs/upstream-tags/$TAG..HEAD"
            echo
            echo "Checked with upstream's test suite and the Windows canary (.fork/canary.ps1) before publishing."
          } > "$RUNNER_TEMP/notes.md"

      - name: Replace an earlier fork release of the same tag
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          git tag -f "$TAG" HEAD

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean --config ${{ runner.temp }}/goreleaser.fork.yaml --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.rebase.outputs.tag }}

      - name: Check the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${TAG#v}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > assets.txt
          for a in checksums.txt skillshare-ui-dist.tar.gz "skillshare_${V}_windows_amd64.zip" "skillshare_${V}_linux_amd64.tar.gz" "skillshare_${V}_darwin_arm64.tar.gz"; do
            grep -qx "$a" assets.txt || { echo "::error::missing asset $a"; exit 1; }
          done
          echo "Published $TAG with $(wc -l < assets.txt) assets" | tee -a "$GITHUB_STEP_SUMMARY"

  report-failure:
    needs: [rebase, test, canary, release]
    if: failure() && needs.rebase.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.rebase.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: "test=${{ needs.test.result }} canary=${{ needs.canary.result }} release=${{ needs.release.result }}"
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Patched release $TAG failed" \
            --body "Building the patched release of upstream $TAG failed ($RESULTS). Nothing new was published; installed copies stay on the previous release. Run: $RUN_URL"
